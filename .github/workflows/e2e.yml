name: e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airflow:
    name: airflow (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "2.10.5"
            script_arg: "2"
            image: apache/airflow:2.10.5
          - name: "3.4.0"
            script_arg: "3"
            image: apache/airflow:3.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Live Airflow check
        env:
          AIRFLOW2_IMAGE: ${{ matrix.image }}
          AIRFLOW3_IMAGE: ${{ matrix.image }}
        run: bash scripts/e2e/run_airflow.sh "${{ matrix.script_arg }}"

  dbt-fixture:
    name: dbt fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Check the dbt Core fixture
        run: python scripts/e2e/check_dbt_fixture.py
