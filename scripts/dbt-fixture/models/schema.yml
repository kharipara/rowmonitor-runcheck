version: 2

models:
  - name: orders
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["shipped"]
          - accepted_values:
              name: orders_status_warn_unless_shipped
              arguments:
                values: ["shipped"]
              config:
                severity: warn
